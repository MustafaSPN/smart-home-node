; ============================================================
; ESP32-S3 (N16R8) — IR Air-Conditioner Controller
; ============================================================
; Two environments:
;   control (default) → Web UI + IR transmit (KY-005)
;   decode            → IR receiver dumper (KY-022) to identify protocol
;
; Identify the remote protocol first:
;   pio run -e decode -t upload && pio device monitor
; Then upload the controller:
;   pio run -e control -t upload && pio device monitor
; ============================================================

[platformio]
default_envs = cloud

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3 N16R8 = 16MB flash + 8MB octal PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.14

; --- Cloud: Firebase-integrated controller for the HomeNode app ---
[env:cloud]
build_src_filter = +<cloud.cpp>

; --- Controller: local Web UI + IR send (LAN only, for testing) ---
[env:control]
build_src_filter = +<main.cpp>

; --- Decoder: identify the AC remote protocol ---
[env:decode]
build_src_filter = +<decode.cpp>
